exclude: ^(conf/|tests/|src/auth/infrastructure/persistence_sqla/alembic/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff — проверка кода
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff — проверка форматирования
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy — проверка типов
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$|uv\.lock$|\.python-version$)
