[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Web_sessions_auth"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
description = "Web sessions service"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.14.1",
    "argon2-cffi>=25.1.0",
    "dishka>=1.4.2",
    "fastapi[standard]>=0.115.7",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.4",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.37",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.1.0",
    "ruff>=0.17.2",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]
force-exclude = true
extend-exclude = [
    "conf",
    "tests",
    "src/auth/infrastructure/persistence_sqla/alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["auth"]
combine-as-imports = true

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src/auth"]
exclude = ['^src/auth/infrastructure/persistence_sqla/alembic/']
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
